<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paintings — Sanace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <header class="site-header is-collapsed">
    <p class="local-time"><span class="local-label">Local /</span> <span id="localTime">--:--:--</span></p>
    <div class="dot-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="header-right">
      <a href="index.html" class="header-wordmark">Sanace</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <a href="index.html#contact" class="pill-btn">Contact Now</a>
    </div>
  </header>

  <main>
    <section class="project-detail paintings-page" id="paintings">
      <div class="section-marker">
        <span class="marker-num">&#9679;</span>
        <span class="marker-label">//Paintings</span>
        <span class="marker-meta"><a href="index.html#work">&larr; Back to Work</a></span>
      </div>
      <h1 class="section-heading reveal">Paintings</h1>
      <p class="section-note reveal">A personal practice outside client work — different sizes and aspect ratios, shown together as they are.</p>

      <div class="painting-grid" id="paintingGrid"></div>
      <p class="paintings-empty" id="paintingsEmpty" hidden>More paintings coming soon.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="wordmark-small"><a href="index.html">Sanace</a></p>
    <p>&copy; 2026 Sanace. All rights reserved.</p>
    <a href="index.html" class="back-to-top">Back to home</a>
  </footer>

  <script src="js/paintings-manifest.js"></script>
  <script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
  <script src="js/script.js" defer></script>
  <script>
    (function () {
      var grid = document.getElementById('paintingGrid');
      var empty = document.getElementById('paintingsEmpty');
      var paintings = window.PAINTINGS || [];

      if (!paintings.length) {
        empty.hidden = false;
        return;
      }

      paintings.forEach(function (painting) {
        var item = document.createElement('figure');
        item.className = 'painting-item';

        var img = document.createElement('img');
        img.src = painting.src;
        img.alt = painting.title || 'Painting';
        img.loading = 'lazy';
        item.appendChild(img);

        if (painting.title) {
          var caption = document.createElement('figcaption');
          caption.className = 'painting-item-title';
          caption.textContent = painting.title;
          item.appendChild(caption);
        }

        grid.appendChild(item);
      });
    })();
  </script>
</body>
</html>
