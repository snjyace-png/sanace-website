<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5 Degrees — Storyboard — Sanace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <header class="site-header is-collapsed">
    <p class="local-time"><span class="local-label">Local /</span> <span id="localTime">--:--:--</span></p>
    <div class="dot-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="header-right">
      <a href="../index.html" class="header-wordmark">Sanace</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <a href="../index.html#contact" class="pill-btn">Contact Now</a>
    </div>
  </header>

  <main>
    <section class="project-detail storyboard-page" id="storyboard">
      <div class="section-marker">
        <span class="marker-num">&#9679;</span>
        <span class="marker-label">//5 Degrees</span>
        <span class="marker-meta"><a href="11.html">&larr; Back to project</a></span>
      </div>
      <h1 class="section-heading reveal">Storyboard</h1>
      <p class="section-note reveal">The final revision pass, 07 September 2023 &mdash; 76 panels, shown in sequence.</p>

      <div class="storyboard-grid is-a4-landscape" id="storyboardGrid"></div>
      <a href="11.html" class="pill-btn pill-btn-outline" style="margin-top: 2rem;">&larr; Back to 5 Degrees</a>
    </section>
  </main>

  <div class="lightbox lightbox--stacked" id="storyboardLightbox" hidden role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous shot">&#8249;</button>
    <button type="button" class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next shot">&#8250;</button>
    <div class="lightbox-stage">
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
    </div>
    <div class="lightbox-details">
      <p class="lightbox-title" id="lightboxTitle"></p>
    </div>
  </div>

  <footer class="site-footer">
    <p class="wordmark-small"><a href="../index.html">Sanace</a></p>
    <p>&copy; 2026 Sanace. All rights reserved.</p>
    <a href="../index.html" class="back-to-top">Back to home</a>
  </footer>

  <script src="../js/5-degrees-storyboard-manifest.js"></script>
  <script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
  <script src="../js/script.js" defer></script>
  <script>
    (function () {
      var grid = document.getElementById('storyboardGrid');
      var shots = window.FIVE_DEGREES_STORYBOARD || [];

      shots.forEach(function (item, index) {
        var fig = document.createElement('figure');
        fig.className = 'storyboard-item';

        var img = document.createElement('img');
        img.src = item.src;
        img.alt = 'Panel ' + item.shot;
        img.loading = 'lazy';
        fig.appendChild(img);

        fig.addEventListener('click', function () {
          openLightbox(index);
        });

        grid.appendChild(fig);
      });

      // Fullscreen lightbox

      var lightbox = document.getElementById('storyboardLightbox');
      var lightboxImage = document.getElementById('lightboxImage');
      var lightboxTitle = document.getElementById('lightboxTitle');
      var lightboxClose = document.getElementById('lightboxClose');
      var lightboxPrev = document.getElementById('lightboxPrev');
      var lightboxNext = document.getElementById('lightboxNext');
      var currentIndex = 0;

      function render(index) {
        var item = shots[index];
        lightboxImage.src = item.src;
        lightboxImage.alt = 'Panel ' + item.shot;
        lightboxTitle.textContent = 'Panel ' + item.shot + ' / ' + shots.length;
      }

      function openLightbox(index) {
        currentIndex = index;
        render(currentIndex);
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        if (typeof lenis !== 'undefined' && lenis) {
          lenis.stop();
        }
      }

      function closeLightbox() {
        lightbox.hidden = true;
        document.body.style.overflow = '';
        if (typeof lenis !== 'undefined' && lenis) {
          lenis.start();
        }
      }

      function showRelative(delta) {
        currentIndex = (currentIndex + delta + shots.length) % shots.length;
        render(currentIndex);
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightboxPrev.addEventListener('click', function () { showRelative(-1); });
      lightboxNext.addEventListener('click', function () { showRelative(1); });

      lightbox.addEventListener('click', function (e) {
        if (!e.target.closest('.lightbox-image, .lightbox-details, .lightbox-close, .lightbox-nav')) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (lightbox.hidden) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showRelative(-1);
        if (e.key === 'ArrowRight') showRelative(1);
      });
    })();
  </script>
</body>
</html>
