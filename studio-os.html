<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Studio OS — Sanace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="header-pill">
      <a href="index.html" class="header-wordmark">Sanace</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <button type="button" class="header-contact-btn" id="osLogoutBtn" hidden>Log Out</button>
    </div>
  </header>

  <main>
    <div class="stack">
      <section>
        <!-- Password gate: verified server-side by api/studio-os.js against the
             same STUDIO_LOG_API_SECRET Studio Log and Wiki use -- one shared
             cached secret, one personal trust boundary. Nothing secret ships
             in this page's source. -->
        <div class="log-gate" id="osGate">
          <div class="log-gate-box">
            <p class="eyebrow">Studio OS</p>
            <h1 class="case-title">Sign in</h1>
            <form id="osGateForm">
              <input type="password" id="osGatePassword" placeholder="Password" autocomplete="current-password" required>
              <button type="submit" class="pill-btn">Enter</button>
            </form>
            <p class="log-gate-error" id="osGateError" hidden>Incorrect password.</p>
          </div>
        </div>

        <div class="log-app" id="osApp" hidden>
          <div class="log-app-header">
            <div>
              <p class="eyebrow">Sanace &middot; Internal</p>
              <h1 class="case-title">Studio OS</h1>
            </div>
            <a href="studio-log.html" class="pill-btn pill-btn-outline">Studio Log</a>
            <a href="wiki.html" class="pill-btn pill-btn-outline">Wiki</a>
            <p class="section-note">What's coming in, what I'm making, when it's due, what happened.</p>
            <p class="log-sync-status" id="osSyncStatus"></p>
          </div>

          <nav class="studio-nav" id="osNav">
            <button type="button" data-view="leads" class="is-active">Leads</button>
            <button type="button" data-view="projects">Projects</button>
            <button type="button" data-view="timeline">Timeline</button>
            <button type="button" data-view="contacts">Contacts</button>
          </nav>

          <!-- LEADS -->
          <section class="studio-view" id="viewLeads" data-view="leads">
            <form class="log-quick-bar" id="leadQuickForm">
              <textarea id="leadQuickInput" rows="1" placeholder="New lead name… (Enter to add, Shift+Enter for a new line)" required></textarea>
              <button type="submit" class="pill-btn">Add Lead</button>
            </form>
            <div class="studio-list" id="leadsList"></div>
          </section>

          <!-- LEAD DETAIL -->
          <section class="studio-view" id="viewLeadDetail" data-view="lead-detail" hidden>
            <div class="detail-panel" id="leadDetailPanel"></div>
          </section>

          <!-- PROJECTS -->
          <section class="studio-view" id="viewProjects" data-view="projects" hidden>
            <div class="studio-list" id="projectsList"></div>
            <p class="log-empty" id="projectsEmptyNote" hidden>Projects are created by converting a confirmed lead.</p>
          </section>

          <!-- PROJECT DETAIL -->
          <section class="studio-view" id="viewProjectDetail" data-view="project-detail" hidden>
            <div class="detail-panel" id="projectDetailPanel"></div>
          </section>

          <!-- TIMELINE -->
          <section class="studio-view" id="viewTimeline" data-view="timeline" hidden>
            <div id="timelineBody"></div>
          </section>

          <!-- CONTACTS -->
          <section class="studio-view" id="viewContacts" data-view="contacts" hidden>
            <form class="log-quick-bar" id="contactQuickForm">
              <textarea id="contactQuickInput" rows="1" placeholder="New contact name… (Enter to add, Shift+Enter for a new line)" required></textarea>
              <button type="submit" class="pill-btn">Add Contact</button>
            </form>
            <div class="studio-list" id="contactsList"></div>
          </section>

          <!-- CONTACT DETAIL -->
          <section class="studio-view" id="viewContactDetail" data-view="contact-detail" hidden>
            <div class="detail-panel" id="contactDetailPanel"></div>
          </section>
        </div>
      </section>

      <div>
        <footer class="site-footer">
          <p class="site-footer-mark">Sanace</p>
          <ul class="site-footer-socials">
            <li><a href="index.html" class="social-text-link">
              <span class="reveal-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></span>Back to Sanace
            </a></li>
            <li><a href="#" class="social-text-link" id="backToTop">
              <span class="reveal-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></span>Back to top
            </a></li>
          </ul>
        </footer>
        <p class="footer-copyright">Private &middot; not part of the public site.</p>
      </div>
    </div>
  </main>

  <script src="js/script.js" defer></script>
  <script src="js/studio-os.js" defer></script>
  <script>
    document.getElementById('backToTop').addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
